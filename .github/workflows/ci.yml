name: Qualidade e privacidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auditar, testar e compilar
        run: npm run check
      - name: Conferir artefato
        run: test -f dist/index.html && test -f dist/src/domain.js
